<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue: "#2563EB",
                "blue-dark": "#1D4ED8",
                "blue-light": "#EFF6FF",
                orange: "#F97316",
                "orange-dark": "#EA6C0A",
              },
            },
          },
        },
      };
    </script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css" />

    <!--
      Apply saved theme BEFORE first paint to prevent flash of wrong theme.
      Reads localStorage and sets the `dark` class on <html> immediately.
    -->
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body class="bg-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- ===== DARK MODE TOGGLE ===== -->
    <button
      id="theme-toggle"
      aria-label="Toggle dark mode"
      class="fixed top-4 right-4 z-40 flex items-center justify-center w-10 h-10 rounded-full shadow-md transition-colors duration-300"
    >
      <!-- Sun icon (shown in dark mode) -->
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="hidden w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1"  x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1"  y1="12" x2="3"  y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <!-- ===== APP WRAPPER ===== -->
    <div class="w-full max-w-xl">

      <!-- Header -->
      <header class="mb-8 text-center">
        <div class="inline-flex items-center gap-2 mb-1">
          <!-- Checklist icon (inline SVG) -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
          <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Task List</h1>
        </div>
        <p class="text-slate-500 text-sm">Stay organised, stay productive.</p>
      </header>

      <!-- ===== MAIN CARD ===== -->
      <main class="bg-white rounded-2xl shadow-md overflow-hidden">

        <!-- Add Task Form -->
        <section class="p-5 border-b border-slate-100" aria-label="Add new task">
          <form id="task-form" novalidate>
            <div class="flex gap-2">
              <input
                id="task-input"
                type="text"
                placeholder="Add a new task…"
                maxlength="120"
                autocomplete="off"
                class="flex-1 rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 transition"
              />
              <button
                type="submit"
                class="rounded-lg bg-brand-blue hover:bg-brand-blue-dark active:scale-95 text-white text-sm font-semibold px-5 py-2.5 transition-all duration-150 whitespace-nowrap"
              >
                + Add
              </button>
            </div>
            <!-- Priority selector row -->
            <div class="flex items-center gap-2 mt-2.5">
              <label for="priority-select" class="text-xs text-slate-500 whitespace-nowrap">Priority:</label>
              <select
                id="priority-select"
                class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs text-slate-700 outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 transition cursor-pointer"
              >
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </div>
          </form>
          <!-- Inline validation message -->
          <p id="input-error" class="mt-1.5 text-xs text-red-500 hidden">Task cannot be empty.</p>
        </section>

        <!-- Status Filter Tabs -->
        <section class="flex border-b border-slate-100" aria-label="Filter tasks by status">
          <button data-filter="all"       class="filter-btn active-filter flex-1 py-3 text-sm font-medium transition-colors duration-150">All</button>
          <button data-filter="active"    class="filter-btn flex-1 py-3 text-sm font-medium transition-colors duration-150">Active</button>
          <button data-filter="completed" class="filter-btn flex-1 py-3 text-sm font-medium transition-colors duration-150">Completed</button>
        </section>

        <!-- Priority Filter Tabs -->
        <section class="flex items-center gap-1.5 px-4 py-2.5 bg-slate-50 border-b border-slate-100" aria-label="Filter tasks by priority">
          <span class="text-xs text-slate-400 mr-1 shrink-0">Priority:</span>
          <button data-priority="all"    class="priority-btn active-priority-filter px-3 py-1 rounded-full text-xs font-medium transition-colors duration-150">All</button>
          <button data-priority="high"   class="priority-btn px-3 py-1 rounded-full text-xs font-medium transition-colors duration-150">High</button>
          <button data-priority="medium" class="priority-btn px-3 py-1 rounded-full text-xs font-medium transition-colors duration-150">Medium</button>
          <button data-priority="low"    class="priority-btn px-3 py-1 rounded-full text-xs font-medium transition-colors duration-150">Low</button>
        </section>

        <!-- Task List -->
        <section aria-label="Task list">
          <ul id="task-list" class="divide-y divide-slate-100">
            <!-- Tasks rendered by script.js -->
          </ul>

          <!-- Empty state -->
          <div id="empty-state" class="hidden flex-col items-center justify-center py-14 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <p class="text-sm font-medium">No tasks here yet.</p>
          </div>
        </section>

        <!-- Footer / Stats -->
        <footer class="flex items-center justify-between px-5 py-3 bg-slate-50 border-t border-slate-100">
          <span id="task-count" class="text-xs text-slate-500">0 items left</span>
          <button
            id="clear-completed"
            class="text-xs text-slate-400 hover:text-red-500 transition-colors duration-150 disabled:opacity-30 disabled:cursor-not-allowed"
          >
            Clear completed
          </button>
        </footer>

      </main><!-- /main card -->

    </div><!-- /app wrapper -->

    <!-- ===== EDIT MODAL ===== -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm px-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 animate-modal">
        <h2 id="modal-title" class="text-base font-semibold text-slate-800 mb-4">Edit Task</h2>
        <input
          id="edit-input"
          type="text"
          maxlength="120"
          class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 transition mb-4"
        />
        <p id="edit-error" class="mb-3 -mt-2 text-xs text-red-500 hidden">Task cannot be empty.</p>
        <!-- Priority selector inside edit modal -->
        <div class="flex items-center gap-2 mb-5">
          <label for="edit-priority-select" class="text-xs text-slate-500 whitespace-nowrap">Priority:</label>
          <select
            id="edit-priority-select"
            class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs text-slate-700 outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 transition cursor-pointer"
          >
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="flex justify-end gap-2">
          <button id="modal-cancel" class="rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 transition">Cancel</button>
          <button id="modal-save"   class="rounded-lg bg-brand-blue hover:bg-brand-blue-dark text-white text-sm font-semibold px-5 py-2 transition">Save</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
